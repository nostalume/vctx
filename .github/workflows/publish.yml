name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Sync dependencies
        run: uv sync --locked --dev --extra visual

      - name: Ruff
        run: uv run ruff check .

      - name: Ty
        run: uv run ty check .

      - name: Pytest
        run: uv run pytest -q -W error::DeprecationWarning

      - name: Build distributions
        run: uv build

      - name: Inspect and smoke built wheel
        shell: bash
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m zipfile -l "$wheel" > wheel-files.txt
          if grep -E '(^|/)(tests|\.agents|scripts|\.github)/|models/|transforms/' wheel-files.txt; then
            echo "development residue or obsolete owners found in wheel" >&2
            exit 1
          fi
          uv run --isolated --no-project --with "$wheel" python -c "import vctx"
          uv run --isolated --no-project --with "$wheel" vctx --help >/dev/null

      - name: Retain release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*

      - name: Publish distributions to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
