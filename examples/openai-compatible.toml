[runtime]
env_files = [".env"]

[cache]
source_dir = ".cache/vctx/source"
model_dir = ".cache/vctx/models"

[evidence]
planner = "instance:ai"
ocr = "auto"
vision = "instance:ai"

[summary]
use = "instance:ai"
language = "native"

[instances.ai.ai]
base_url = "https://provider.example/v1"
model = "multimodal-model"
credential = "env:VCTX_AI_API_KEY"
format = "auto"

[output]
projections = ["context", "read"]
retain_media = true
